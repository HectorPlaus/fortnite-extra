<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control de Espíritus</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header class="page-header">
      
      <div class="controls-row">
        <div class="actions">
          <button id="resetAll">Reiniciar todo</button>
          <div class="summary">
            <span id="totalSpirits"></span>
            <span id="registeredCount"></span>
            <span id="dominatedCount"></span>
          </div>
        </div>
        <div class="sort-panel">
          <label for="sortSelect">Ordenar por</label>
          <select id="sortSelect">
            <option value="default">Predeterminado</option>
            <option value="registered">Registrados</option>
            <option value="rarity">Rareza</option>
            <option value="status">Dominados</option>
          </select>
        </div>
      </div>
    </header>

    <section class="section">
      <div id="spiritGrid" class="grid"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
