<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control de Espíritus</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main>
    <header class="page-header">

      <div class="controls-row">
        <div class="actions">
          <button id="resetAll">Reiniciar todo</button>
          <div class="summary">
            <span id="totalSpirits"></span>
            <span id="registeredCount"></span>
            <span id="dominatedCount"></span>
          </div>
        </div>
        <div class="sort-panel">
          <button id="sortButton" type="button" aria-expanded="false" aria-controls="sortMenu">
            Filtros y orden ▾
          </button>

          <div id="sortMenu" class="hidden" role="dialog" aria-label="Panel de filtros y ordenación">
            <div class="menu-section">
              <h4>Ordenar por</h4>
              <select id="sortSelect">
                <option value="default">Predeterminado</option>
                <option value="rarity">Rareza</option>
                <option value="status">Estado</option>
                <option value="variant">Variante</option>
              </select>
            </div>

            <div class="menu-section">
              <h4>Rareza</h4>
              <select id="rarityFilterSelect">
                <option value="all">Todas</option>
                <option value="rare">Rare</option>
                <option value="epic">Epic</option>
                <option value="legendary">Legendary</option>
                <option value="mythic">Mythic</option>
              </select>
            </div>

            <div class="menu-section">
              <h4>Variante</h4>
              <select id="variantFilterSelect">
                <option value="all">Todas</option>
                <option value="base">Básicas</option>
                <option value="gold">Oro</option>
                <option value="gummy">Gummy</option>
                <option value="galaxy">Galaxy</option>
              </select>
            </div>

            <div class="menu-section">
              <h4>Estado</h4>
              <select id="statusFilterSelect">
                <option value="all">Todos</option>
                <option value="registered">Registrados</option>
                <option value="notRegistered">No registrados</option>
                <option value="dominated">Dominados</option>
                <option value="notDominated">No dominados</option>
              </select>
            </div>

            <button id="clearFiltersButton" type="button" class="secondary-action">Limpiar filtros</button>
          </div>
        </div>
      </div>
    </header>

    <section class="section">
      <div id="spiritGrid" class="grid"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
