<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control de Espíritus</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main>
    <header class="page-header">

      <div class="controls-row">
        <div class="actions">
          <button id="resetAll">Reiniciar todo</button>
          <div class="summary">
            <span id="totalSpirits"></span>
            <span id="registeredCount"></span>
            <span id="dominatedCount"></span>
          </div>
        </div>
        <div class="sort-panel">
          <button id="sortButton" type="button" aria-expanded="false" aria-controls="sortMenu">
            Filtros y orden ▾
          </button>

          <div id="sortMenu" class="hidden" role="dialog" aria-label="Panel de filtros y ordenación">
            <div class="menu-section">
              <h4>Ordenar por</h4>
              <select id="sortSelect">
                <option value="default">Predeterminado</option>
                <option value="rarity">Rareza</option>
                <option value="status">Estado</option>
                <option value="variant">Variante</option>
              </select>
            </div>

            <div class="menu-section">
              <h4>Espíritus</h4>
              <div id="spiritFilterOptions" class="checkbox-list"></div>
            </div>

            <div class="menu-section">
              <h4>Rareza</h4>
              <div class="checkbox-list">
                <label class="filter-option"><input type="checkbox" value="rare" data-filter-group="rarity"> Rare</label>
                <label class="filter-option"><input type="checkbox" value="epic" data-filter-group="rarity"> Epic</label>
                <label class="filter-option"><input type="checkbox" value="legendary" data-filter-group="rarity"> Legendary</label>
                <label class="filter-option"><input type="checkbox" value="mythic" data-filter-group="rarity"> Mythic</label>
              </div>
            </div>

            <div class="menu-section">
              <h4>Variante</h4>
              <div id="variantFilterOptions" class="checkbox-list"></div>
            </div>

            <div class="menu-section">
              <h4>Estado</h4>
              <div class="checkbox-list">
                <label class="filter-option"><input type="checkbox" value="registered" data-filter-group="status"> Registrados</label>
                <label class="filter-option"><input type="checkbox" value="notRegistered" data-filter-group="status"> No registrados</label>
                <label class="filter-option"><input type="checkbox" value="dominated" data-filter-group="status"> Dominados</label>
                <label class="filter-option"><input type="checkbox" value="notDominated" data-filter-group="status"> No dominados</label>
              </div>
            </div>

            <div class="menu-section">
              <h4>Amigos</h4>
              <div class="friend-controls">
                <div class="friend-add">
                  <input id="friendNameInput" type="text" placeholder="Agregar amigo" aria-label="Nombre del amigo" />
                  <button id="addFriendButton" type="button">Añadir</button>
                </div>
                <div id="friendFilterOptions" class="checkbox-list"></div>
              </div>
            </div>

            <button id="clearFiltersButton" type="button" class="secondary-action">Limpiar filtros</button>
          </div>
        </div>
      </div>
    </header>

    <section class="section">
      <div id="spiritGrid" class="grid"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
